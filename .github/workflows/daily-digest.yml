name: Generate Daily Feed

on:
  schedule:
    - cron: '0 22 * * *'  # UTC 22:00 = Beijing 06:00
    - cron: '30 1 * * 1-5'  # arXiv follow-up: Beijing 09:30, after the daily release
  workflow_dispatch:
    inputs:
      x_llm:
        description: 'LLM for X/Twitter summaries'
        required: false
        default: 'config'
        type: choice
        options:
          - 'config'
          - 'doubao-pro'
          - 'doubao-turbo'
          - 'deepseek-pro'
          - 'deepseek-flash'
          - 'minimax-m3'
      generate_summaries:
        description: 'Generate legacy central LLM summaries for manual debugging.'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
      transcribe_missing:
        description: 'Use Volc ASR to transcribe selected podcasts without public transcripts.'
        required: false
        default: 'config'
        type: choice
        options:
          - 'config'
          - 'false'
          - 'true'
      transcribe_semianalysis:
        description: 'Transcribe the newest SemiAnalysis episode using official YouTube captions, with ASR fallback.'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
      feed_scope:
        description: 'Limit a manual run to one feed type.'
        required: false
        default: 'all'
        type: choice
        options:
          - 'all'
          - 'podcasts'

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 75

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements-central.txt

      - name: Run tests
        run: python -m unittest discover -s tests -p 'test_*.py'

      # X 不在云端抓：X 对 GitHub Actions 的机房 IP 段返回 403（2026-09-06 确认，
      # 同一份新 cookie 住宅 IP 能抓、云端连跑两次都 403）。feed-x.json 改由
      # Mac mini 上的 launchd 任务跑 `--twitter-only` 后单独提交，本 workflow
      # 既不抓也不提交它（见下面 Commit feeds 的 git add 清单）。
      # TWITTER_COOKIES 因此不再注入 —— 云端没有任何一步需要它。
      - name: Generate feeds
        env:
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          if [ "$SCHEDULE" = "30 1 * * 1-5" ]; then
            python scripts/generate_feed.py --arxiv-only
          elif [ "${{ inputs.feed_scope }}" = "podcasts" ]; then
            python scripts/generate_feed.py --podcasts-only
          else
            python scripts/generate_feed.py --skip-twitter
          fi

      - name: Transcribe selected missing podcast transcripts
        if: ${{ github.event.schedule != '30 1 * * 1-5' && (github.event_name == 'schedule' || inputs.transcribe_missing == 'true' || inputs.transcribe_missing == 'config' || inputs.transcribe_semianalysis == 'true') }}
        env:
          VOLC_ASR_API_KEY: ${{ secrets.VOLC_ASR_API_KEY }}
          EVENT_NAME: ${{ github.event_name }}
          TRANSCRIBE_MISSING: ${{ inputs.transcribe_missing }}
          TRANSCRIBE_SEMIANALYSIS: ${{ inputs.transcribe_semianalysis }}
        run: |
          if [ "$EVENT_NAME" = "schedule" ] || [ "$TRANSCRIBE_MISSING" != "false" ]; then
            python scripts/transcribe_missing_podcasts.py
          fi
          if [ "$TRANSCRIBE_SEMIANALYSIS" = "true" ]; then
            python scripts/transcribe_missing_podcasts.py \
              --only-channel SemiAnalysis \
              --force-channel SemiAnalysis \
              --limit 1
          fi

      - name: Validate feed uniqueness
        env:
          SCHEDULE: ${{ github.event.schedule }}
          FEED_SCOPE: ${{ inputs.feed_scope }}
        run: |
          if [ "$SCHEDULE" = "30 1 * * 1-5" ]; then
            scope="arxiv"
          elif [ "$FEED_SCOPE" = "podcasts" ]; then
            scope="podcasts"
          else
            scope="all"
          fi
          python scripts/validate_feeds.py --scope "$scope"

      - name: Generate central summaries
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.generate_summaries == 'true' }}
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          ARK_API_KEY: ${{ secrets.ARK_API_KEY }}
          MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
          X_LLM_PRESET: ${{ inputs.x_llm || 'config' }}
        run: |
          pids=""
          if [ "$X_LLM_PRESET" = "deepseek-pro" ] || [ "$X_LLM_PRESET" = "deepseek-flash" ]; then
            x_key="$DEEPSEEK_API_KEY"
          elif [ "$X_LLM_PRESET" = "minimax-m3" ]; then
            x_key="$MINIMAX_API_KEY"
          else
            x_key="$ARK_API_KEY"
          fi
          if [ -n "$x_key" ]; then
            python scripts/generate_summaries.py --profile zh_standard --type x --x-llm "$X_LLM_PRESET" --max-workers 3 &
            pids="$pids $!"
          else
            echo "Required API key is not set; skipping X summaries for $X_LLM_PRESET."
          fi
          if [ -n "$ARK_API_KEY" ]; then
            python scripts/generate_summaries.py --profile zh_standard --type papers --limit 12 --max-workers 4 &
            pids="$pids $!"
          else
            echo "ARK_API_KEY is not set; skipping paper summaries."
          fi
          if [ -n "$DEEPSEEK_API_KEY" ]; then
            python scripts/generate_summaries.py --profile zh_short --profile zh_standard --profile zh_deep --type podcasts --limit 5 &
            pids="$pids $!"
          else
            echo "DEEPSEEK_API_KEY is not set; skipping podcast summaries."
          fi
          for pid in $pids; do
            wait "$pid"
          done

      - name: Commit feeds
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # feeds/feed-x.json 故意不在这个清单里：它归 Mac mini 那条通路写。
          # 两个写者同时 add 同一个文件 = 每天一次 rebase 冲突，而云端这边
          # 根本没有 X 数据可写（--skip-twitter）。删这一项是承重的，不是清理。
          git add feeds/feed-podcasts.json feeds/feed-arxiv.json feeds/feed-blogs.json feeds/feed-transcripts-index.json feeds/transcripts -f
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.generate_summaries }}" = "true" ]; then
            [ -f feeds/feed-summaries.json ] && git add feeds/feed-summaries.json -f
            [ -d content/summaries ] && git add content/summaries -f
          fi
          git diff --staged --quiet || git commit -m "Feed update $(date -u +%Y-%m-%d)"
          # mini 可能在 checkout 之后、push 之前提交了 feed-x.json，那样裸 push 会被拒。
          # rebase 而不是 merge，保持线性历史；两边改的文件不重叠所以不会有冲突。
          git pull --rebase origin main
          git push
