name: Generate Daily Feed

on:
  push:
    branches: [main]
    paths: ['feeds/podcast-inbox/**', '.github/whisper-production-request.txt']
  schedule:
    # 2026-09-07: moved 2h earlier (was '0 22', Beijing 06:00) and off the top of
    # the hour. Consumers on the Mac read this feed at Beijing 06:15; GitHub's
    # scheduled-trigger queue delay on this repo has been measured at +14~19 min
    # (late Aug) and +83~110 min (since Aug 29), so a nominal 06:00 release was
    # consistently landing at 07:20-07:45 — after the consumer had already run,
    # i.e. the Mac was reading a day-old digest every single day.
    # Nominal Beijing 04:13 + worst observed delay (110 min) = 06:03, still ahead
    # of the 06:15 consumer. The ':13' is deliberate: on-the-hour slots are the
    # most congested and take the longest to dequeue.
    - cron: '13 20 * * *'  # UTC 20:13 = Beijing 04:13
    - cron: '30 1 * * 1-5'  # arXiv follow-up: Beijing 09:30, after the daily release
  workflow_dispatch:
    inputs:
      transcribe_only:
        description: 'Process the durable cloud Whisper queue without refreshing other feeds.'
        required: false
        default: false
        type: boolean
      x_llm:
        description: 'LLM for X/Twitter summaries'
        required: false
        default: 'config'
        type: choice
        options:
          - 'config'
          - 'doubao-pro'
          - 'doubao-turbo'
          - 'deepseek-pro'
          - 'deepseek-flash'
          - 'minimax-m3'
      generate_summaries:
        description: 'Generate legacy central LLM summaries for manual debugging.'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
      transcribe_missing:
        description: 'Use cloud CPU Whisper for eligible queued podcasts without public transcripts.'
        required: false
        default: 'config'
        type: choice
        options:
          - 'config'
          - 'false'
          - 'true'
      transcribe_semianalysis:
        description: 'Restrict cloud Whisper processing to eligible SemiAnalysis episodes (no policy override).'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
      feed_scope:
        description: 'Limit a manual run to one feed type.'
        required: false
        default: 'all'
        type: choice
        options:
          - 'all'
          - 'podcasts'

concurrency:
  group: ai-signal-feed-main
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 75

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Plan podcast processing
        id: plan
        env:
          EVENT_NAME: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          PUSH_MESSAGE: ${{ github.event.head_commit.message }}
          TRANSCRIBE_ONLY: ${{ inputs.transcribe_only }}
          TRANSCRIBE_MISSING: ${{ inputs.transcribe_missing }}
          SEMIANALYSIS: ${{ inputs.transcribe_semianalysis }}
        run: |
          echo "WHISPER_JOB_DEADLINE=$(( $(date +%s) + 65 * 60 ))" >> "$GITHUB_ENV"
          enabled_by_default=$(python -c 'import json; print(str(json.load(open("config/sources.json"))["podcasts"]["transcription"].get("enabled_by_default", True)).lower())')
          transcribe=false
          capture=true
          skip_generation=false
          if [ "$EVENT_NAME" = "push" ] && [[ "$PUSH_MESSAGE" == *"[run-whisper-production]"* ]]; then
            transcribe=true
            skip_generation=true
          elif [ "$EVENT_NAME" = "push" ]; then
            : # Existing local-inbox imports stay import-only.
          elif [ "$SCHEDULE" = "30 1 * * 1-5" ]; then
            capture=false
          elif [ "$TRANSCRIBE_MISSING" = "true" ] || [ "$SEMIANALYSIS" = "true" ]; then
            transcribe=true
          elif [ "$EVENT_NAME" = "schedule" ] || [ "$TRANSCRIBE_MISSING" != "false" ]; then
            transcribe=$enabled_by_default
          fi
          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ "$TRANSCRIBE_ONLY" = "true" ]; then
            skip_generation=true
            transcribe=true
          fi
          echo "transcribe=$transcribe" >> "$GITHUB_OUTPUT"
          echo "capture=$capture" >> "$GITHUB_OUTPUT"
          echo "skip_generation=$skip_generation" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: pip install -r requirements-central.txt

      - name: Install cloud Whisper dependencies
        if: steps.plan.outputs.transcribe == 'true'
        timeout-minutes: 7
        run: |
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends ffmpeg
          fi
          pip install -r requirements-whisper-pilot.txt

      - name: Run tests
        run: python -m unittest discover -s tests -p 'test_*.py'

      - name: Preserve pending podcasts before refresh
        if: steps.plan.outputs.capture == 'true'
        run: |
          python scripts/cloud_whisper_queue.py --enqueue-only
          if git diff --quiet -- feeds/feed-podcasts.json feeds/feed-transcripts-index.json ':(glob)feeds/transcripts/*.txt' && \
             [ -z "$(git ls-files --others --exclude-standard -- ':(glob)feeds/transcripts/*.txt')" ]; then
            bash scripts/checkpoint_whisper.sh --queue-only
          else
            # Cache/publication repair must persist its sidecar/index/feed together.
            bash scripts/checkpoint_whisper.sh
          fi

      # X 不在云端抓：X 对 GitHub Actions 的机房 IP 段返回 403（2026-09-06 确认，
      # 同一份新 cookie 住宅 IP 能抓、云端连跑两次都 403）。feed-x.json 改由
      # Mac mini 上的 launchd 任务跑 `--twitter-only` 后单独提交，本 workflow
      # 既不抓也不提交它（见下面 Commit feeds 的 git add 清单）。
      # TWITTER_COOKIES 因此不再注入 —— 云端没有任何一步需要它。
      - name: Generate feeds
        if: steps.plan.outputs.skip_generation != 'true'
        env:
          SCHEDULE: ${{ github.event.schedule }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = "push" ]; then
            python scripts/local_podcast_import.py
          elif [ "$SCHEDULE" = "30 1 * * 1-5" ]; then
            python scripts/generate_feed.py --arxiv-only
          elif [ "${{ inputs.feed_scope }}" = "podcasts" ]; then
            python scripts/generate_feed.py --podcasts-only
          else
            python scripts/generate_feed.py --skip-twitter
          fi

      - name: Capture eligible refreshed podcasts
        if: steps.plan.outputs.capture == 'true'
        run: python scripts/cloud_whisper_queue.py --enqueue-only

      - name: Validate feed uniqueness
        env:
          SCHEDULE: ${{ github.event.schedule }}
          FEED_SCOPE: ${{ inputs.feed_scope }}
          EVENT_NAME: ${{ github.event_name }}
          TRANSCRIBE_ONLY: ${{ steps.plan.outputs.skip_generation }}
        run: |
          if [ "$TRANSCRIBE_ONLY" = "true" ]; then
            scope="podcasts"
          elif [ "$SCHEDULE" = "30 1 * * 1-5" ]; then
            scope="arxiv"
          elif [ "$FEED_SCOPE" = "podcasts" ] || [ "$EVENT_NAME" = "push" ]; then
            scope="podcasts"
          else
            scope="all"
          fi
          python scripts/validate_feeds.py --scope "$scope"

      - name: Generate central summaries
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.generate_summaries == 'true' }}
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          ARK_API_KEY: ${{ secrets.ARK_API_KEY }}
          MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
          X_LLM_PRESET: ${{ inputs.x_llm || 'config' }}
        run: |
          pids=""
          if [ "$X_LLM_PRESET" = "deepseek-pro" ] || [ "$X_LLM_PRESET" = "deepseek-flash" ]; then
            x_key="$DEEPSEEK_API_KEY"
          elif [ "$X_LLM_PRESET" = "minimax-m3" ]; then
            x_key="$MINIMAX_API_KEY"
          else
            x_key="$ARK_API_KEY"
          fi
          if [ -n "$x_key" ]; then
            python scripts/generate_summaries.py --profile zh_standard --type x --x-llm "$X_LLM_PRESET" --max-workers 3 &
            pids="$pids $!"
          else
            echo "Required API key is not set; skipping X summaries for $X_LLM_PRESET."
          fi
          if [ -n "$ARK_API_KEY" ]; then
            python scripts/generate_summaries.py --profile zh_standard --type papers --limit 12 --max-workers 4 &
            pids="$pids $!"
          else
            echo "ARK_API_KEY is not set; skipping paper summaries."
          fi
          if [ -n "$DEEPSEEK_API_KEY" ]; then
            python scripts/generate_summaries.py --profile zh_short --profile zh_standard --profile zh_deep --type podcasts --limit 5 &
            pids="$pids $!"
          else
            echo "DEEPSEEK_API_KEY is not set; skipping podcast summaries."
          fi
          for pid in $pids; do
            wait "$pid"
          done

      - name: Commit feeds
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # feeds/feed-x.json 故意不在这个清单里：它归 Mac mini 那条通路写。
          # 两个写者同时 add 同一个文件 = 每天一次 rebase 冲突，而云端这边
          # 根本没有 X 数据可写（--skip-twitter）。删这一项是承重的，不是清理。
          git add feeds/feed-podcasts.json feeds/feed-arxiv.json feeds/feed-blogs.json feeds/feed-transcripts-index.json -f
          if [ -n "$(git ls-files -- ':(glob)feeds/transcripts/*.txt')" ] || compgen -G 'feeds/transcripts/*.txt' >/dev/null; then
            git add -f -- ':(glob)feeds/transcripts/*.txt'
          fi
          [ ! -f feeds/whisper-queue.json ] || git add feeds/whisper-queue.json -f
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.generate_summaries }}" = "true" ]; then
            [ -f feeds/feed-summaries.json ] && git add feeds/feed-summaries.json -f
            [ -d content/summaries ] && git add content/summaries -f
          fi
          git diff --staged --quiet || git commit -m "Feed update $(date -u +%Y-%m-%d)"
          # mini 可能在 checkout 之后、push 之前提交了 feed-x.json，那样裸 push 会被拒。
          # rebase 而不是 merge，保持线性历史；两边改的文件不重叠所以不会有冲突。
          git pull --rebase origin main
          git push

      # The old Volc stage and its API-key injection are intentionally removed.
      # Each bounded attempt is committed independently, including its failures.
      - name: Process at most two cloud Whisper episodes
        id: whisper
        if: steps.plan.outputs.transcribe == 'true'
        env:
          SEMIANALYSIS: ${{ inputs.transcribe_semianalysis }}
          OMP_NUM_THREADS: '4'
          HF_HUB_DISABLE_TELEMETRY: '1'
        run: |
          failed=0
          args=()
          if [ "$SEMIANALYSIS" = "true" ]; then
            args+=(--only-channel SemiAnalysis)
          fi
          for attempt in 1 2; do
            remaining=$(( WHISPER_JOB_DEADLINE - $(date +%s) ))
            if [ "$remaining" -lt 300 ]; then
              echo "Remaining job budget is too small; leave due episodes queued for the next run."
              break
            fi
            timeout_seconds=$remaining
            if [ "$timeout_seconds" -gt 1800 ]; then timeout_seconds=1800; fi
            if ! python scripts/cloud_whisper_queue.py --process-one \
              --timeout-seconds "$timeout_seconds" --checkpoint-git \
              --output-dir "$RUNNER_TEMP/whisper-production/$attempt" "${args[@]}"; then
              failed=1
            fi
            python scripts/validate_feeds.py --scope podcasts
            bash scripts/checkpoint_whisper.sh
          done
          echo "failed=$failed" >> "$GITHUB_OUTPUT"
          python scripts/cloud_whisper_queue.py --status

      - name: Preserve interrupted Whisper checkpoints
        if: ${{ always() && steps.plan.outputs.transcribe == 'true' && steps.whisper.outcome != 'skipped' && steps.whisper.outcome != '' }}
        run: |
          if ! bash scripts/checkpoint_whisper.sh; then
            # Persist recoverable publication intent without publishing an invalid feed.
            bash scripts/checkpoint_whisper.sh --queue-only
            exit 1
          fi

      - name: Keep cloud Whisper results and queue status
        if: ${{ always() && steps.plan.outputs.transcribe == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: whisper-production-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/whisper-production/
            feeds/whisper-queue.json
          if-no-files-found: warn
          retention-days: 7

      - name: Report unsuccessful transcription attempts
        if: ${{ always() && steps.whisper.outputs.failed == '1' }}
        run: |
          echo "One or more transcription attempts failed. Successful episodes and failure states were checkpointed; inspect the queue and artifacts."
          exit 1
