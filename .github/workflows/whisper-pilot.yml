name: CPU Whisper Pilot (explicit opt-in)

on:
  # Branch-only trial explicitly requested by the maintainer. Both filters and
  # the commit marker below must match; normal code/docs pushes never run ASR.
  push:
    branches: ['codex/cloud-whisper-pilot']
    paths: ['.github/whisper-pilot-request.txt']
  workflow_dispatch:
    inputs:
      guid:
        description: 'Exact eligible episode GUID from cloud_whisper_pilot.py --list'
        required: true
        type: string
      model:
        description: 'English or multilingual small model (CPU int8)'
        type: choice
        default: small.en
        options: [small.en, small]
      language:
        description: 'Use small for auto/zh'
        type: choice
        default: en
        options: [en, auto, zh]
      sample_seconds:
        description: 'Start with 300 seconds; 0 explicitly requests full episode'
        type: choice
        default: '300'
        options: ['60', '300', '0']
      start_seconds:
        description: 'Sample offset 0–600; full episode requires 0'
        type: string
        default: '60'

permissions:
  contents: read

concurrency:
  group: ai-signal-whisper-pilot
  cancel-in-progress: false

jobs:
  pilot:
    if: >-
      ${{ github.event_name == 'workflow_dispatch' ||
          (github.event_name == 'push' &&
           github.ref == 'refs/heads/codex/cloud-whisper-pilot' &&
           contains(github.event.head_commit.message, '[run-whisper-pilot]')) }}
    # Standard Linux CPU runner only. No paid API keys, GPU or larger runner.
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install isolated pilot dependencies
        timeout-minutes: 7
        run: |
          python -m pip install -r requirements-whisper-pilot.txt
          command -v ffmpeg
          command -v ffprobe
      - name: Test pilot safeguards
        run: python -m unittest discover -s tests -p 'test_cloud_whisper_pilot.py'
      - name: Transcribe one bounded episode sample
        env:
          EPISODE_GUID: ${{ github.event_name == 'push' && '233d9970-74f8-42c7-8383-f7ea5f70f1d6' || inputs.guid }}
          MODEL: ${{ github.event_name == 'push' && 'small.en' || inputs.model }}
          LANGUAGE: ${{ github.event_name == 'push' && 'en' || inputs.language }}
          SAMPLE_SECONDS: ${{ github.event_name == 'push' && '300' || inputs.sample_seconds }}
          START_SECONDS: ${{ github.event_name == 'push' && '60' || inputs.start_seconds }}
          OMP_NUM_THREADS: '4'
          HF_HUB_DISABLE_TELEMETRY: '1'
        run: |
          python scripts/cloud_whisper_pilot.py \
            --guid "$EPISODE_GUID" --model "$MODEL" --language "$LANGUAGE" \
            --sample-seconds "$SAMPLE_SECONDS" --start-seconds "$START_SECONDS" \
            --threads 4 --timeout-seconds 1800 \
            --output-dir "$RUNNER_TEMP/whisper-pilot-results"
      - name: Keep transcript and measurements (including failures)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: whisper-pilot-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/whisper-pilot-results/
          if-no-files-found: warn
          retention-days: 7
