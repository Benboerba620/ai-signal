<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>AI Signal · 一键精读</title>
<style>
  body { font: 16px/1.6 -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif; margin: 0; padding: 32px 20px; background: #fafafa; color: #222; }
  main { max-width: 560px; margin: 0 auto; }
  a.btn { display: inline-block; margin: 12px 12px 0 0; padding: 10px 18px; border-radius: 8px; background: #222; color: #fff; text-decoration: none; }
  a.alt { background: #e6e6e6; color: #222; }
  pre { white-space: pre-wrap; background: #fff; border: 1px solid #ddd; border-radius: 8px; padding: 12px; font-size: 13px; }
  @media (prefers-color-scheme: dark) { body { background: #111; color: #eee; } a.btn { background: #eee; color: #111; } a.alt { background: #333; color: #eee; } pre { background: #1b1b1b; border-color: #333; } }
</style>
</head>
<body>
<main>
  <p id="status">正在准备精读提示词…</p>
  <div id="actions" hidden>
    <a class="btn" id="claude" href="#">用 Claude 精读</a>
    <a class="btn alt" id="chatgpt" href="#">用 ChatGPT 精读</a>
    <pre id="prompt"></pre>
  </div>
</main>
<script>
// Builds the deep-read prompt from short hash parameters and opens the reader's
// own Claude or ChatGPT with it filled in. Nothing is sent until the reader
// presses send there. Parameters: k = x | p | b, id = tweet id, u = source URL,
// tr = transcript file id, lang = zh | en, via = claude | chatgpt.
(function () {
  var FEEDS = "https://cdn.jsdelivr.net/gh/Benboerba620/ai-signal@main/feeds/";
  var TARGETS = { claude: "https://claude.ai/new?q=", chatgpt: "https://chatgpt.com/?q=" };
  var P = new URLSearchParams(location.hash.slice(1));
  var kind = P.get("k"), id = P.get("id") || "", src = P.get("u") || "", tr = P.get("tr") || "";
  var lang = P.get("lang") === "en" ? "en" : "zh";
  var via = TARGETS[P.get("via")] ? P.get("via") : "claude";
  var T = lang === "zh" ? {
    head: "请精读下面这条内容，用中文回答：1. 核心观点；2. 关键事实和数字；3. 为什么重要；4. 有哪些疑点或反方观点。只依据原文，原文没有的不要编。",
    source: "来源：", title: "标题：", link: "原文：", transcript: "全文转录：", text: "原文内容："
  } : {
    head: "Deep-read the item below: 1. core argument; 2. key facts and numbers; 3. why it matters; 4. open questions or counterpoints. Use only the source; do not invent anything it does not say.",
    source: "Source: ", title: "Title: ", link: "Original: ", transcript: "Full transcript: ", text: "Text: "
  };

  function feed(name) {
    return fetch(FEEDS + name, { cache: "no-cache" }).then(function (r) { return r.ok ? r.json() : {}; }).catch(function () { return {}; });
  }

  function lookup() {
    if (kind === "x" && id) {
      return feed("feed-x.json").then(function (d) {
        var accounts = d.x || [];
        for (var i = 0; i < accounts.length; i++) {
          var tweets = accounts[i].tweets || [];
          for (var j = 0; j < tweets.length; j++) {
            if (String(tweets[j].id) === id) {
              return { source: (accounts[i].name || accounts[i].handle) + " (X)", text: tweets[j].text, url: tweets[j].url };
            }
          }
        }
        return { source: "X" };
      });
    }
    if (kind === "p") {
      return feed("feed-podcasts.json").then(function (d) {
        var eps = d.podcasts || [];
        for (var i = 0; i < eps.length; i++) {
          if (eps[i].link === src || eps[i].guid === src) return { source: eps[i].channel, title: eps[i].title };
        }
        return { source: "Podcast" };
      });
    }
    if (kind === "b") {
      return feed("feed-blogs.json").then(function (d) {
        var arts = d.articles || [];
        for (var i = 0; i < arts.length; i++) {
          if (arts[i].url === src) return { source: arts[i].source_name || arts[i].source, title: arts[i].title };
        }
        return { source: "Blog" };
      });
    }
    return Promise.resolve({});
  }

  lookup().then(function (item) {
    var lines = [T.head];
    if (item.source) lines.push(T.source + item.source);
    if (item.title) lines.push(T.title + item.title);
    if (item.text) lines.push(T.text + String(item.text).slice(0, 600));
    if (tr && /^[A-Za-z0-9_-]+$/.test(tr)) lines.push(T.transcript + FEEDS + "transcripts/" + tr + ".txt");
    var link = item.url || src;
    if (/^https?:\/\//.test(link)) lines.push(T.link + link);
    var prompt = lines.join("\n");
    var q = encodeURIComponent(prompt);
    document.getElementById("claude").href = TARGETS.claude + q;
    document.getElementById("chatgpt").href = TARGETS.chatgpt + q;
    document.getElementById("prompt").textContent = prompt;
    if (lines.length <= 2) {
      document.getElementById("status").textContent = "这条内容已经不在最新 feed 里，下面是能找到的信息。";
      document.getElementById("actions").hidden = false;
      return;
    }
    document.getElementById("status").textContent = "正在打开 " + (via === "claude" ? "Claude" : "ChatGPT") + "…如果没有自动跳转，点下面的按钮。";
    document.getElementById("actions").hidden = false;
    location.replace(TARGETS[via] + q);
  });
})();
</script>
</body>
</html>
